name: Build TVBox APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 安装系统 Gradle 工具
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 查找 build.gradle 所在目录并编译 Debug APK
      - name: Build with Gradle
        run: |
          # 查找工程根目录（防止工程在子文件夹中）
          PROJECT_DIR=$(dirname $(find . -maxdepth 2 -name "build.gradle" | head -n 1))
          cd "${PROJECT_DIR:-.}"
          echo "Building in: $(pwd)"
          gradle assembleDebug --stacktrace

      # 收集生成的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-debug-apk
          path: "**/*.apk"
