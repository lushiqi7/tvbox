name: Build TVBox APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 全盘搜索工程文件并编译
      - name: Build with Gradle
        run: |
          echo "=== 打印当前仓库根目录结构 ==="
          ls -la

          # 全盘查找包含 settings.gradle 或 build.gradle 的工程主目录
          ROOT_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)

          if [ -z "$ROOT_FILE" ]; then
            echo "❌ 严重错误：仓库中未找到任何 Gradle 配置文件！"
            find . -maxdepth 3
            exit 1
          fi

          TARGET_DIR=$(dirname "$ROOT_FILE")
          echo "--> 目标工程目录定位为: $TARGET_DIR"
          cd "$TARGET_DIR"

          # 如果存在本地 gradlew 则赋予执行权限，否则调用系统 gradle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-debug-apk
          path: "**/*.apk"
